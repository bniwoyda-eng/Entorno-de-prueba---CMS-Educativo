name: Deploy to Dev

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Check out the repository
        uses: actions/checkout@v3

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: 'us-east-1'

      - name: Log in to Amazon ECR
        id: ecr_login
        uses: aws-actions/amazon-ecr-login@v2
        with:
          registries: '626635407562'
          registry-type: private

      - name: Verify Docker login
        env:
          ECR_REGISTRY: 626635407562.dkr.ecr.us-east-1.amazonaws.com
        run: |
          echo "Verifying Docker login..."
          aws ecr get-login-password --region us-east-1 | docker login --username AWS --password-stdin $ECR_REGISTRY

      - name: Build, tag, and push image to ECR
        env:
          ECR_REGISTRY: 626635407562.dkr.ecr.us-east-1.amazonaws.com
          ECR_REPOSITORY: dev-ms-csm
          IMAGE_TAG: latest
        run: |
          echo "Building the Docker image..."
          docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG .
          echo "Pushing the Docker image to ECR..."
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG

      - name: Logout from Amazon ECR
        env:
          ECR_REGISTRY: 626635407562.dkr.ecr.us-east-1.amazonaws.com
        run: docker logout $ECR_REGISTRY

      - name: Deploy to ECS
        env:
          CLUSTER_NAME: dev-cluster-csm 
          SERVICE_NAME: dev-service-csm
          ECR_REGISTRY: 626635407562.dkr.ecr.us-east-1.amazonaws.com
          ECR_REPOSITORY: dev-ms-csm
          IMAGE_TAG: latest
        run: |
          echo "Updating ECS service with new image..."
          aws ecs update-service --cluster $CLUSTER_NAME --service $SERVICE_NAME --force-new-deployment
